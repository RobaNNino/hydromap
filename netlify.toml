# AcquaMap frontend — Netlify config
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "frontend"
  # Build della console React (business-app) -> frontend/business-app/.
  # Il resto del frontend (mappa) resta HTML/JS vanilla statico.
  command = "npm --prefix business-app ci && npm --prefix business-app run build"

[build.environment]
  NODE_VERSION = "20"

# Console React (SPA): le rotte client di /business-app/* tornano all'index
# (gli asset reali esistono come file e vengono serviti prima del redirect).
[[redirects]]
  from = "/business-app/*"
  to = "/business-app/index.html"
  status = 200

# AcquaMap Business — URL amichevoli verso le pagine statiche (rewrite 200).
# Devono precedere il fallback SPA "/*" (Netlify: prima regola che matcha vince).
[[redirects]]
  from = "/acquamap/business/apply"
  to = "/business/apply.html"
  status = 200
[[redirects]]
  from = "/acquamap/business/dashboard"
  to = "/business/dashboard.html"
  status = 200
[[redirects]]
  from = "/admin/acquamap/business/map"
  to = "/business/admin-map.html"
  status = 200
[[redirects]]
  from = "/admin/acquamap/business"
  to = "/business/admin.html"
  status = 200
[[redirects]]
  from = "/acquamap/business"
  to = "/business/directory.html"
  status = 200
[[redirects]]
  from = "/acquamap/business/:slug"
  to = "/business/profile.html?slug=:slug"
  status = 200

# SPA-style fallback (in realtà c'è una sola pagina, ma evita 404 su refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "DENY"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "geolocation=(self)"

# Cache statici
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
