# AcquaMap frontend — Netlify config
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "frontend"
  # nessun build step: il frontend è HTML + JS vanilla, già pronto
  command = ""

# AcquaMap Business — URL amichevoli verso le pagine statiche (rewrite 200).
# Devono precedere il fallback SPA "/*" (Netlify: prima regola che matcha vince).
[[redirects]]
  from = "/acquamap/business/apply"
  to = "/business/apply.html"
  status = 200
[[redirects]]
  from = "/acquamap/business/dashboard"
  to = "/business/dashboard.html"
  status = 200
[[redirects]]
  from = "/admin/acquamap/business/map"
  to = "/business/admin-map.html"
  status = 200
[[redirects]]
  from = "/admin/acquamap/business"
  to = "/business/admin.html"
  status = 200
[[redirects]]
  from = "/acquamap/business"
  to = "/business/directory.html"
  status = 200
[[redirects]]
  from = "/acquamap/business/:slug"
  to = "/business/profile.html?slug=:slug"
  status = 200

# SPA-style fallback (in realtà c'è una sola pagina, ma evita 404 su refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "DENY"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "geolocation=(self)"

# Cache statici
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
