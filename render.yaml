# AcquaMap backend — Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hydromap-api
    env: python
    plan: free                          # cambia in 'starter' se vuoi più memoria/no-sleep
    region: frankfurt                   # 'frankfurt' o 'oregon'
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false                     # da impostare manualmente nel dashboard Render
      # --- AcquaMap Business (Supabase) ---
      - key: SUPABASE_URL
        value: https://bzzbgtxlpwecqfydbguy.supabase.co
      - key: SUPABASE_JWKS_URL
        value: https://bzzbgtxlpwecqfydbguy.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_rPLQi9Swf8d4vzzYSocSQA_3JxZQ25N
      - key: SUPABASE_SECRET_KEY
        sync: false                     # SECRET key (service_role) — impostare nel dashboard Render, mai committare
      - key: BUSINESS_ADMIN_EMAILS
        sync: false                     # email admin separate da virgola
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_NEWS_MODEL
        value: gemini-2.5-pro
      - key: NEWS_MAX_AGE_DAYS
        value: "30"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Limita CORS al solo dominio Netlify in produzione (vedi backend/app.py)
      - key: CORS_ORIGINS
        value: "*"
